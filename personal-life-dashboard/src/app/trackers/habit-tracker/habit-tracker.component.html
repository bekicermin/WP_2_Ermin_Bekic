<div class="page-background">
  <div class="tracker-box">
    <h3>Habit Tracker</h3>

    <input
      type="number"
      placeholder="Broj navika danas"
      [(ngModel)]="habit"
    >

    <button (click)="saveHabit()">Save</button>
    <button (click)="resetHabit()">Reset</button>

    <p>Trenutno stanje: {{ savedHabit }} navika</p>

    <a routerLink="/my-trackers">Nazad</a>
  </div>
</div>
