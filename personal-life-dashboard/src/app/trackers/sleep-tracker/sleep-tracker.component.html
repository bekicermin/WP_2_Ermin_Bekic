<div class="page-background">
  <div class="tracker-box">
    <h3>Sleep Tracker</h3>

    <input type="number" placeholder="Sati spavanja" [(ngModel)]="sleep">
    <button (click)="saveSleep()">Save</button>

	<button (click)="resetSleep()">Reset</button>

	<br><br>





    <p>Trenutno stanje: {{ savedSleep }} sati</p>


  </div>
</div>
