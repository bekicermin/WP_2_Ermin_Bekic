<div class="page-background">
  <div class="tracker-box">
    <h3>Water Tracker</h3>

    <input
      type="number"
      placeholder="Čaše vode"
      [(ngModel)]="water"
    >

    <button (click)="saveWater()">Save</button>
    <button (click)="resetWater()">Reset</button>

    <p>Trenutno stanje: {{ savedWater }} čaša</p>

    <a routerLink="/my-trackers">Nazad</a>
  </div>
</div>
