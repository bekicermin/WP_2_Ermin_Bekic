<h2>Registracija</h2>

<form>
  <div>
    <label>Ime:</label><br>
    <input type="text">
  </div>

  <div>
    <label>Email:</label><br>
    <input type="email">
  </div>

  <div>
    <label>Password:</label><br>
    <input type="password">
  </div>

  <div>
    <label>Tema:</label><br>
    <select>
      <option value="light">Svijetla</option>
      <option value="dark">Tamna</option>
      <option value="blue">Plava</option>
    </select>
  </div>

  <br>
  <button type="submit">Register</button>
</form>

<p>
  Već imaš račun?
  <a href="/login">Login</a>
</p>
